<!doctype html>
<html lang="en" class="studio">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reverie</title>
<!-- In-browser Reverie: nothing leaves this browser (local.js). -->
<link rel="icon" href="data:," />
<link rel="stylesheet" href="static/style.css" />
<link rel="stylesheet" href="static/reverie.css" />
</head>
<body class="studio rv">
  <header class="rv-head">
    <a href="index.html" class="rv-word">reverie</a>
    <nav class="rv-nav">
      <a href="#today" data-page="today">today</a>
      <a href="#journal" data-page="journal">journal</a>
      <a href="#library" data-page="library">library</a>
    </nav>
    <button class="rv-listen" id="listen" data-state="off" title="Tap to pause or resume listening">
      <span class="rv-dot"></span><span id="listenWord">listen</span>
    </button>
  </header>

  <main class="rv-page" id="page"></main>
  <footer class="rv-local-note">Everything stays in this browser: your playing is transcribed here, and nothing is uploaded.
    Clearing this site's data erases your sketches.</footer>

  <div class="rv-gate hidden" id="gate"><p>tap anywhere to begin listening</p></div>
  <audio id="player" preload="metadata"></audio>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.js"></script>
  <script src="static/transkun.js"></script>
  <script src="static/student.js"></script>
  <script src="static/facts.js"></script>
  <script src="static/views.js"></script>
  <script src="static/capture_local.js"></script>
  <script src="static/local.js"></script>
  <div class="rv-loading" id="loading">
    <p class="rv-loading-word">getting ready</p>
    <div class="rv-loading-bar"><div id="loadingFill"></div></div>
    <p class="rv-loading-note" id="loadingNote">&nbsp;</p>
  </div>
  <script>
    // Loading screen: download (first time only) and warm up the models before listening, so the
    // first sketch comes back as fast as possible. The tap that dismisses it starts the microphone.
    window.DEFER_LISTENING = true;
    (() => {
      const box = document.getElementById("loading"), word = box.querySelector(".rv-loading-word");
      const fill = document.getElementById("loadingFill"), note = document.getElementById("loadingNote");
      const mb = (x) => (x / 1e6).toFixed(0);
      ReverieModels.load((phase, done, total) => {
        if (phase === "download" && total) {
          fill.style.width = `${Math.min(100, (100 * done) / total).toFixed(1)}%`;
          note.textContent = done < total ? `downloading the listening model · ${mb(done)} of ${mb(total)} MB (first time only)` : "";
        }
        if (phase === "warm") {
          fill.style.width = "100%";
          word.textContent = "warming up";
          note.textContent = "\u00a0";
        }
      }).then(
        () => {
          word.textContent = "tap anywhere to begin listening";
          box.classList.add("ready");
          box.addEventListener("click", () => {
            box.classList.add("gone");
            Capture.start();
          }, { once: true });
        },
        (err) => {
          console.error(err);
          word.textContent = "couldn't load the listening model";
          note.textContent = "Check your connection and reload the page.";
        },
      );
    })();
  </script>
  <script src="static/reverie.js"></script>
  <script>
    // ?debug: live listening readout (level vs. threshold, burst, pipeline).
    if (new URLSearchParams(location.search).has("debug")) {
      const box = document.createElement("div");
      box.className = "rv-debug";
      document.body.append(box);
      setInterval(() => {
        const d = Capture.debug(), s = window.LocalStatus || {};
        const f = (x) => (x == null ? "–" : x.toFixed(1));
        box.textContent = `state ${d.state} · audio ${d.ctx || "–"} ${d.rate || ""}Hz\nlevel ${f(d.db)} dB · threshold ${f(d.threshold)} dB\n` +
          `burst ${d.burst ? (d.burst.sinceMs / 1000).toFixed(0) + "s, closes 12s after quiet" : "none"}\nmodels ${s.models} · ${s.step}`;
      }, 250);
    }
  </script>
</body>
</html>
